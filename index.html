<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12395b">
<title>English PM Coach</title>
<style>
:root{--nav:#103a5f;--blue:#1778f2;--blue2:#e8f2ff;--green:#11865b;--red:#c43a31;--amber:#b56a00;--bg:#f3f7fb;--card:#fff;--text:#172331;--muted:#64748b;--line:#d9e3ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}button,select,textarea,input{font:inherit}header{background:linear-gradient(135deg,#103a5f,#16769b);color:white;padding:22px 16px}.wrap{max-width:1050px;margin:auto}header h1{margin:0;font-size:clamp(25px,5vw,36px)}header p{margin:5px 0 0;opacity:.92}.status{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:#ffffff1f;padding:6px 10px;border-radius:999px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#66e3a4}main{padding:14px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 13px}.tab,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.tab{background:#e4edf6;color:var(--nav);white-space:nowrap}.tab.active,.btn.primary{background:var(--blue);color:white}.btn{background:#e7edf4;color:var(--nav)}.btn.good{background:var(--green);color:white}.btn.danger{background:#fee9e7;color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:var(--card);border:1px solid #edf1f5;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #173b6010}.card h2,.card h3{color:var(--nav);margin-top:0}.hero{background:linear-gradient(135deg,#fff,#eaf5ff)}label{display:block;font-weight:750;color:var(--nav);margin:9px 0 5px}select,textarea,input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--text)}textarea{min-height:105px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.grow{flex:1!important}.mic{width:86px;height:86px;border-radius:50%;border:8px solid #dcecff;background:var(--blue);color:white;font-size:31px;cursor:pointer;box-shadow:0 8px 24px #1677ff42}.mic.listening{background:var(--red);border-color:#ffd0cc;animation:pulse 1.3s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.center{text-align:center}.panel{background:#f7faff;border:1px solid var(--line);padding:13px;border-radius:13px;margin-top:10px;min-height:55px}.panel strong{color:var(--nav)}.professional{border-left:5px solid var(--green);background:#f0fbf6}.corrected{border-left:5px solid var(--blue);background:#f2f7ff}.note{font-size:13px;color:var(--muted)}.warning{color:var(--amber);background:#fff6e7;border:1px solid #f2d39d;padding:10px;border-radius:12px}.ok{color:var(--green);font-weight:750}.error{color:var(--red);font-weight:750}.pill{display:inline-block;background:var(--blue2);color:#125d9e;border-radius:999px;padding:4px 9px;margin:3px;font-size:13px}.word{font-size:25px;font-weight:850;color:var(--nav)}.meter{height:11px;background:#dfe8f1;border-radius:10px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#26a269,#6dcc9b);width:0}.chat{max-height:390px;overflow:auto;padding:5px}.bubble{max-width:87%;padding:11px 13px;border-radius:15px;margin:8px 0}.bot{background:#e8f2ff;margin-right:auto}.user{background:#def6e9;margin-left:auto}.hidden{display:none}.small{font-size:13px}.actions{margin-top:10px}.kbd{background:#eef2f6;border:1px solid #d4dde7;border-bottom-width:3px;padding:2px 6px;border-radius:6px}.footer{text-align:center;color:var(--muted);padding:24px 10px}@media(max-width:600px){main{padding:10px}.card{padding:15px}.row.mobile-stack>*{width:100%}.mic{width:78px;height:78px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>English PM Coach</h1><p>Speak • Translate • Correct • Practise professional English</p><div class="status"><span class="dot"></span><span id="supportText">Checking microphone support…</span></div></div></header>
<main class="wrap">
<nav class="tabs" id="tabs"></nav><section id="page"></section>
</main><div class="footer">For learning practice. Voice recognition uses your browser's speech service; availability varies by browser.</div>
<script>
const $=s=>document.querySelector(s), esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition=null,listening=false,liveFinal='';
let state=JSON.parse(localStorage.getItem('pmcoach2')||'{"sessions":0,"words":[],"history":[]}');const save=()=>localStorage.setItem('pmcoach2',JSON.stringify(state));
const tabs=['Voice Coach','PM Lessons','Role-play','Vocabulary','Progress'];
const phraseBank=[
 {h:['site access','access confirm','एक्सेस','पहुँच'],natural:'The customer has not yet confirmed site access.',pm:'Site-access confirmation is still pending. We are coordinating with the customer to protect the planned execution schedule.'},
 {h:['cable ready','केबल','wiring','वायरिंग'],natural:'The cable is not yet ready.',pm:'Cable readiness remains an open dependency and may affect the planned commissioning sequence.'},
 {h:['approval','अप्रूवल','मंजूरी'],natural:'The approval is still pending.',pm:'The required approval remains pending. Confirmation by the target date is needed to protect the schedule.'},
 {h:['resource','engineer','इंजीनियर','संसाधन'],natural:'The engineer is not available.',pm:'Engineering resource availability is being coordinated against the required site dates.'},
 {h:['delay','late','देरी'],natural:'The activity has been delayed.',pm:'Progress has been impacted. Recovery actions are being implemented to minimize the schedule impact.'},
 {h:['shutdown','शटडाउन'],natural:'We need to confirm the shutdown schedule.',pm:'Please confirm the shutdown window so that execution resources and commissioning activities can be aligned.'},
 {h:['meeting','मीटिंग'],natural:'We need to discuss the open points.',pm:'The meeting objective is to align on the open points, confirm owners, and agree the next steps.'}
];
const replacements=[[/customer not give/gi,'the customer has not provided'],[/work is delay/gi,'the work has been delayed'],[/we are discuss/gi,'we are discussing'],[/we discussed yesterday/gi,'as discussed yesterday'],[/do the needful/gi,'please take the required action'],[/revert back/gi,'reply'],[/more better/gi,'better'],[/pending from customer/gi,'pending with the customer'],[/kindly confirm urgently/gi,'please confirm by the required date']];
const vocab=[
 ['align','uh-LINE','तालमेल / सहमति','Let us align on the commissioning plan.'],['constraint','kuhn-STRAYNT','बाधा / सीमा','Site access is a key constraint.'],['mitigate','MIT-uh-gayt','प्रभाव कम करना','We will mitigate the schedule impact.'],['dependency','dih-PEN-duhn-see','निर्भरता','Cable readiness is a dependency.'],['feasible','FEE-zuh-buhl','व्यावहारिक / संभव','Please confirm whether the plan is feasible.'],['escalate','ES-kuh-layt','उच्च स्तर पर उठाना','We will escalate the risk if required.']];
function speak(text,rate=.82){if(!('speechSynthesis'in window))return alert('Text-to-speech is not supported in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-IN';u.rate=rate;speechSynthesis.speak(u)}
function correctEnglish(t){let out=t.trim();replacements.forEach(([a,b])=>out=out.replace(a,b));if(out&&!/[.!?]$/.test(out))out+='.';return out.charAt(0).toUpperCase()+out.slice(1)}
function coach(t,mode){const low=t.toLowerCase();let match=phraseBank.find(p=>p.h.some(k=>low.includes(k.toLowerCase())));let natural=match?match.natural:correctEnglish(t);let pm=match?match.pm:(natural?`Professional version: ${natural} Please confirm the owner, target date, and next action.`:'');if(mode==='en-IN'&&natural===t)natural=correctEnglish(t);return {natural,pm}}
function annotate(t){let tips=[];if(/\bnot give\b/i.test(t))tips.push('Use “has not provided” instead of “not give”.');if(/\bis delay\b/i.test(t))tips.push('Use “has been delayed” instead of “is delay”.');if(/customer/i.test(t))tips.push('For management-safe wording, describe the pending item, impact, and recovery action.');if(!tips.length)tips.push('Good start. Add the owner, target date, impact, and next action for a stronger PM update.');return tips}
function nav(n){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.n===n));render(n)}
function render(n){const p=$('#page');if(n==='Voice Coach')p.innerHTML=voicePage();if(n==='PM Lessons')p.innerHTML=lessonPage();if(n==='Role-play')p.innerHTML=rolePage();if(n==='Vocabulary')p.innerHTML=vocabPage();if(n==='Progress')p.innerHTML=progressPage();}
function voicePage(){return `<div class="card hero"><h2>Hybrid Voice Coach</h2><p>Speak in Hindi, Hinglish, or English. The browser creates a live transcript; the coach then gives a natural English and project-management version.</p><div class="warning small"><b>Prototype limitation:</b> The free version uses browser recognition and a PM phrase bank. It does not send text to a paid AI translation service, so open-ended Hindi translation may need manual editing.</div></div>
<div class="grid"><div class="card center"><label for="lang">I will speak in</label><select id="lang"><option value="hi-IN">Hindi / Hinglish</option><option value="en-IN">English (India)</option><option value="en-US">English (US)</option></select><p></p><button id="mic" class="mic" onclick="toggleMic()" aria-label="Start microphone">🎙️</button><p id="micStatus" class="note">Tap the microphone and allow access</p><div class="row" style="justify-content:center"><button class="btn" onclick="stopMic()">■ Stop</button><button class="btn danger" onclick="clearCoach()">Clear</button></div></div>
<div class="card"><h3>Live transcript</h3><textarea id="transcript" placeholder="Your speech will appear here. You can also type or edit text."></textarea><div class="row actions"><button class="btn primary" onclick="analyse()">✨ Improve my English</button><button class="btn" onclick="speak($('#transcript').value)">🔊 Hear input</button></div></div></div>
<div id="results" class="hidden"><div class="card corrected"><h3>Natural English</h3><div id="natural"></div><div class="actions"><button class="btn" onclick="speak($('#natural').innerText)">🔊 Listen</button><button class="btn" onclick="copyText($('#natural').innerText)">Copy</button></div></div><div class="card professional"><h3>Professional PM English</h3><div id="pm"></div><div class="actions"><button class="btn good" onclick="speak($('#pm').innerText,.76)">🔊 Listen slowly</button><button class="btn" onclick="copyText($('#pm').innerText)">Copy</button></div></div><div class="card"><h3>Coach notes</h3><ul id="tips"></ul><button class="btn primary" onclick="repeatMode()">🎯 Start listen-and-repeat</button><div id="repeatBox" class="hidden panel"></div></div></div>`}
function toggleMic(){if(!SR)return alert('Speech recognition is unavailable. Use current Chrome or Edge, or type in the box.');listening?stopMic():startMic()}
function startMic(){recognition=new SR();recognition.lang=$('#lang').value;recognition.continuous=true;recognition.interimResults=true;liveFinal=$('#transcript').value?$('#transcript').value+' ':'';recognition.onstart=()=>{listening=true;$('#mic').classList.add('listening');$('#micStatus').textContent='Listening… speak naturally';};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)liveFinal+=s+' ';else interim+=s;}$('#transcript').value=liveFinal+interim};recognition.onerror=e=>{$('#micStatus').textContent='Microphone error: '+e.error;};recognition.onend=()=>{listening=false;const m=$('#mic');if(m)m.classList.remove('listening');const s=$('#micStatus');if(s)s.textContent='Stopped. Tap microphone to continue.'};try{recognition.start()}catch(e){}}
function stopMic(){if(recognition)recognition.stop();listening=false}
function clearCoach(){stopMic();$('#transcript').value='';$('#results').classList.add('hidden')}
function analyse(){const t=$('#transcript').value.trim();if(!t)return alert('Please speak or type a sentence first.');const r=coach(t,$('#lang').value);$('#natural').textContent=r.natural;$('#pm').textContent=r.pm;$('#tips').innerHTML=annotate(t).map(x=>`<li>${esc(x)}</li>`).join('');$('#results').classList.remove('hidden');state.sessions++;state.history.unshift({d:new Date().toLocaleDateString(),input:t,output:r.pm});state.history=state.history.slice(0,20);save();$('#results').scrollIntoView({behavior:'smooth'})}
function repeatMode(){const text=$('#pm').innerText;$('#repeatBox').classList.remove('hidden');$('#repeatBox').innerHTML='<b>Step 1:</b> Listen carefully.<br><b>Step 2:</b> Repeat the sentence aloud.<br><b>Step 3:</b> Record again and compare the transcript.';speak(text,.68)}
function copyText(t){navigator.clipboard?.writeText(t);alert('Copied')}
function lessonPage(){const items=[['Status update','Status → cause → recovery action → impact','Progress was impacted by pending site access. The team is coordinating access and resequencing available work to protect the commissioning date.'],['Risk update','Risk → trigger → impact → mitigation','There is a schedule risk if cable readiness is not achieved by Thursday. Daily follow-up and parallel testing are planned as mitigation.'],['Action request','Action → owner → deadline → reason','Please confirm the shutdown window by Thursday so that resources and commissioning activities can be finalized.'],['Executive update','Outcome → next milestone → business impact','PLC checkout progressed as planned. The remaining focus is interface validation, supporting commissioning readiness.']];return '<h2>Project Management English</h2><div class="grid">'+items.map(x=>`<div class="card"><h3>${x[0]}</h3><span class="pill">${x[1]}</span><div class="panel">${x[2]}</div><button class="btn actions" onclick="speak(${JSON.stringify(x[2])})">🔊 Practise</button></div>`).join('')+'</div>'}
const scenarios=[{q:'Why has commissioning not started?',hint:'Mention the dependency, impact, action, and next confirmation.',model:'Commissioning is pending completion of cable readiness and site-access confirmation. Both items are being actively coordinated, and the revised start date will be confirmed once the dependencies are closed.'},{q:'Can you complete the work this week?',hint:'Avoid a simple yes/no. State conditions and confidence.',model:'Completion this week remains feasible, subject to access and resource confirmation by Wednesday. The team is monitoring both dependencies daily.'},{q:'Why is the project delayed?',hint:'Stay factual and management-safe.',model:'Progress has been affected by access and interface-readiness constraints. Recovery actions are in place, and the team is prioritizing critical-path activities.'}];let scenario=0;
function rolePage(){const s=scenarios[scenario%scenarios.length];return `<div class="card"><h2>Customer Meeting Role-play</h2><p class="note">The coach plays the customer. Answer aloud or type your response.</p><div class="chat"><div class="bubble bot"><b>Customer:</b> ${s.q}</div><div id="userBubble"></div></div><div class="panel"><b>Structure hint:</b> ${s.hint}</div><textarea id="roleAnswer" placeholder="Give your professional answer..."></textarea><div class="row actions"><button class="btn primary" onclick="roleMic()">🎙️ Answer by voice</button><button class="btn" onclick="showModel()">Show model answer</button><button class="btn" onclick="nextScenario()">Next scenario</button></div><div id="model" class="hidden panel professional"><b>Model answer:</b> ${s.model}<br><button class="btn actions" onclick="speak(${JSON.stringify(s.model)})">🔊 Listen</button></div></div>`}
function roleMic(){if(!SR)return alert('Speech recognition is unavailable. Type your answer instead.');const r=new SR();r.lang='en-IN';r.interimResults=false;r.onresult=e=>{const t=e.results[0][0].transcript;$('#roleAnswer').value=t;$('#userBubble').innerHTML=`<div class="bubble user"><b>You:</b> ${esc(t)}</div>`};r.start()}
function showModel(){$('#model').classList.remove('hidden');const t=$('#roleAnswer').value;if(t)$('#userBubble').innerHTML=`<div class="bubble user"><b>You:</b> ${esc(t)}</div>`}
function nextScenario(){scenario++;render('Role-play')}
function vocabPage(){return '<h2>PM Vocabulary & Pronunciation</h2><div class="grid">'+vocab.map(v=>`<div class="card"><div class="word">${v[0]}</div><div class="note">/${v[1]}/</div><p class="ok">Hindi: ${v[2]}</p><div class="panel">${v[3]}</div><div class="row actions"><button class="btn" onclick="speak('${v[0]}',.65)">🔊 Word</button><button class="btn" onclick="speak(${JSON.stringify(v[3])},.72)">🔊 Sentence</button><button class="btn" onclick="saveWord('${v[0]}')">＋ Save</button></div></div>`).join('')+'</div>'}
function saveWord(w){if(!state.words.includes(w))state.words.push(w);save();alert(w+' saved')}
function progressPage(){const pct=Math.min(100,state.sessions*10);return `<div class="grid"><div class="card"><h2>Your progress</h2><p><b>${state.sessions}</b> coaching sessions completed on this device</p><div class="meter"><span style="width:${pct}%"></span></div><p class="note">First milestone: 10 sessions</p><p><b>Saved words:</b> ${state.words.length?state.words.map(w=>`<span class="pill">${esc(w)}</span>`).join(' '):'None yet'}</p></div><div class="card"><h3>Recommended daily routine</h3><p>5 min voice coach • 5 min pronunciation • 5 min PM role-play</p><button class="btn danger" onclick="resetProgress()">Reset local progress</button></div></div><div class="card"><h3>Recent practice</h3>${state.history.length?state.history.map(h=>`<div class="panel"><b>${esc(h.d)}</b><br><span class="note">You said:</span> ${esc(h.input)}<br><span class="note">PM version:</span> ${esc(h.output)}</div>`).join(''):'<p class="note">No practice saved yet.</p>'}</div>`}
function resetProgress(){if(confirm('Reset progress on this device?')){state={sessions:0,words:[],history:[]};save();render('Progress')}}
$('#tabs').innerHTML=tabs.map(n=>`<button class="tab" data-n="${n}" onclick="nav('${n}')">${n}</button>`).join('');
$('#supportText').textContent=SR?'Microphone supported in this browser':'Speech recognition unavailable; typing mode still works';nav('Voice Coach');
</script>
</body></html>
