<!doctype html>
<html lang="en"><head><meta name="ms-sp-authoring-source" content="agent"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12395b"><title>English PM Coach</title>
<style>
:root{--nav:#12395b;--blue:#1677ff;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#64748b;--green:#11865b}*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#12395b,#176a92);color:#fff;padding:28px 18px}header h1{margin:0;font-size:28px}header p{margin:6px 0 0;opacity:.9}.wrap{max-width:980px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}.tabs button,.btn{border:0;border-radius:12px;padding:11px 14px;background:#e5edf6;color:#12395b;font-weight:700;cursor:pointer;white-space:nowrap}.tabs button.active,.btn.primary{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--card);padding:18px;border-radius:18px;box-shadow:0 4px 18px #12395b12;margin-bottom:14px}h2,h3{color:#12395b}.word{font-size:27px;font-weight:800}.meaning{color:var(--green);font-weight:700}.muted{color:var(--muted)}.example{border-left:4px solid var(--blue);padding:9px 12px;background:#f5f9ff;border-radius:8px;margin:10px 0}.quiz button{display:block;width:100%;text-align:left;margin:8px 0}.good{color:var(--green);font-weight:800}.bad{color:#c0392b;font-weight:800}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}.progress{height:10px;background:#dbe5ef;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#22a06b}.pill{display:inline-block;background:#e7f1ff;color:#145ea8;padding:4px 9px;border-radius:99px;font-size:13px;margin:3px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.daily{font-size:18px}footer{text-align:center;color:var(--muted);padding:28px 10px}@media(max-width:520px){header{padding:22px 16px}.wrap{padding:12px}.card{padding:15px}}
</style></head><body><header><div class="wrap"><h1>English PM Coach</h1><p>English learning for Hindi speakers • Vocabulary • Pronunciation • Project Management English</p></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="page"></div></main><footer>Practice 15–20 minutes daily. Progress is saved on this device.</footer>
<script>
const lessons={
Vocabulary:[
{w:'align',ph:'uh-LINE',hi:'तालमेल / सहमति बनाना',ex:'Let us align on the commissioning plan before the shutdown.'},
{w:'constraint',ph:'kuhn-STRAYNT',hi:'बाधा / सीमा',ex:'Site access remains a key project constraint.'},
{w:'mitigate',ph:'MIT-uh-gayt',hi:'जोखिम या प्रभाव कम करना',ex:'We have prepared a recovery plan to mitigate the schedule impact.'},
{w:'dependency',ph:'dih-PEN-duhn-see',hi:'निर्भरता',ex:'Cable readiness is a dependency for commissioning.'},
{w:'escalate',ph:'ES-kuh-layt',hi:'उच्च स्तर पर उठाना',ex:'We will escalate the issue if it affects the critical path.'},
{w:'feasible',ph:'FEE-zuh-buhl',hi:'व्यावहारिक / संभव',ex:'Please confirm whether the proposed shutdown window is feasible.'}],
'PM English':[
{title:'Status Updates',bad:'We are late because customer not give access.',good:'Progress was impacted by site-access constraints. We are coordinating the required access and implementing recovery actions.',tip:'State: status → cause → action → impact.'},
{title:'Risk Communication',bad:'This will create big problem.',good:'This presents a schedule risk if the dependency is not closed by the target date.',tip:'Use objective language: risk, dependency, impact, mitigation.'},
{title:'Requesting Action',bad:'Please do needful urgently.',good:'Please confirm the required approval by Thursday to protect the planned commissioning date.',tip:'Ask for one action, one owner, and one date.'},
{title:'Meeting Language',bad:'We need discuss and finish this.',good:'The objective is to align on the open points, agree the owners, and finalize the next steps.',tip:'Use align, agree, confirm, finalize, close.'},
{title:'Executive Update',bad:'Many activities done this week.',good:'PLC checkout progressed as planned, with remaining activities focused on interface validation and commissioning readiness.',tip:'Lead with outcome and business/project impact.'}],
Pronunciation:[
{w:'schedule',ph:'SKED-jool / SHED-yool',hi:'कार्यक्रम',ex:'The commissioning schedule has been updated.'},
{w:'project',ph:'PROJ-ekt (noun)',hi:'परियोजना',ex:'The project remains on track.'},
{w:'priority',ph:'pry-OR-uh-tee',hi:'प्राथमिकता',ex:'Safety is our first priority.'},
{w:'resource',ph:'REE-sors / rih-SORS',hi:'संसाधन',ex:'We need to confirm resource availability.'},
{w:'availability',ph:'uh-vay-luh-BIL-uh-tee',hi:'उपलब्धता',ex:'Please confirm your availability.'}]
};
const tabs=['Today','Vocabulary','Pronunciation','PM English','Practice','Progress'];
const defaultState={done:0,days:{}};
const storage=(()=>{try{return window.localStorage}catch(e){return null}})();
function loadState(){if(!storage)return {...defaultState,days:{}};try{return JSON.parse(storage.getItem('epm')||JSON.stringify(defaultState))}catch(e){return {...defaultState,days:{}}}}
let state=loadState();
function save(){if(!storage)return;try{storage.setItem('epm',JSON.stringify(state))}catch(e){}}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.75;speechSynthesis.speak(u)}}function nav(n){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent==n));render(n)}
function vocabCard(x){return `<div class="card"><div class="word">${x.w} <button class="btn" onclick="speak('${x.w}')">🔊 Listen</button></div><div class="muted">/${x.ph}/</div><p class="meaning">Hindi: ${x.hi}</p><div class="example">${x.ex}</div><button class="btn" onclick="speak(${JSON.stringify(x.ex)})">🔊 Hear sentence</button></div>`}
function complete(){let d=new Date().toISOString().slice(0,10);if(!state.days[d]){state.days[d]=1;state.done++;save()}nav('Progress')}
function render(n){let p=document.getElementById('page');if(n==='Today'){let x=lessons.Vocabulary[new Date().getDate()%lessons.Vocabulary.length];p.innerHTML=`<div class="card daily"><h2>Today's 15-minute lesson</h2><p><b>1. Learn:</b> one useful PM word</p></div>${vocabCard(x)}<div class="card"><h3>Speak aloud 3 times</h3><div class="example">“The key priority today is to close the remaining dependencies and protect the commissioning schedule.”</div><button class="btn" onclick="speak('The key priority today is to close the remaining dependencies and protect the commissioning schedule.')">🔊 Listen</button> <button class="btn primary" onclick="complete()">✓ Complete today</button></div>`}else if(n==='Vocabulary'||n==='Pronunciation'){p.innerHTML=`<h2>${n}</h2><div class="grid">${lessons[n].map(vocabCard).join('')}</div>`}else if(n==='PM English'){p.innerHTML='<h2>Project Management English Lessons</h2>'+lessons[n].map(x=>`<div class="card"><h3>${x.title}</h3><p class="bad">✕ Basic: ${x.bad}</p><p class="good">✓ Professional: ${x.good}</p><p><span class="pill">Technique</span> ${x.tip}</p><button class="btn" onclick="speak(${JSON.stringify(x.good)})">🔊 Practice pronunciation</button></div>`).join('')}else if(n==='Practice'){p.innerHTML=`<div class="card"><h2>Speaking & Writing Practice</h2><p>Rewrite this in professional PM English:</p><div class="example">We cannot finish because cable is not ready and customer access is pending.</div><textarea id="ans" placeholder="Type your improved sentence..."></textarea><div class="row" style="margin-top:10px"><button class="btn primary" onclick="document.getElementById('model').classList.remove('hidden')">Show model answer</button><button class="btn" onclick="speak(document.getElementById('ans').value)">🔊 Hear my answer</button></div><div id="model" class="card hidden" style="margin-top:12px"><b>Model:</b> Completion is dependent on cable readiness and site access. We are coordinating both items to minimize the impact on the planned schedule.</div></div><div class="card"><h3>60-second speaking drill</h3><p>Give a project update using:</p><span class="pill">Current status</span><span class="pill">Key risk</span><span class="pill">Mitigation</span><span class="pill">Next step</span></div>`}else{let pct=Math.min(100,state.done*10);p.innerHTML=`<div class="card"><h2>Your Progress</h2><p><b>${state.done}</b> daily sessions completed on this device.</p><div class="progress"><span style="width:${pct}%"></span></div><p class="muted">10 sessions = first milestone</p><button class="btn" onclick="if(confirm('Reset progress?')){state={done:0,days:{}};save();render('Progress')}">Reset</button></div><div class="card"><h3>Recommended routine</h3><p>5 min vocabulary • 5 min pronunciation • 5 min PM speaking/writing</p></div>`}}
document.getElementById('tabs').innerHTML=tabs.map(x=>`<button onclick="nav('${x}')">${x}</button>`).join('');nav('Today');
</script></body></html>
